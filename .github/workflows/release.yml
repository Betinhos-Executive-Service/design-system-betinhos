name: Release

# Tag vX.Y.Z (igual à versão do Design System) publica @betinhos-executive-service/tokens e @betinhos-executive-service/ui no GitHub Packages.
on:
  push:
    tags: ['v*.*.*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@betinhos'
      - run: pnpm install --frozen-lockfile
      - name: Tag igual à versão dos pacotes
        run: node scripts/check-versions.mjs "${GITHUB_REF_NAME#v}"
      - name: Publicar no GitHub Packages
        # pnpm troca `workspace:^` pela versão publicada. Sem --no-git-checks o pnpm recusa publicar a partir da tag (HEAD destacado).
        run: pnpm -r --filter "./packages/*" publish --access restricted --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release no GitHub
        run: gh release create "$GITHUB_REF_NAME" --title "Design System $GITHUB_REF_NAME" --notes "Pacotes @betinhos-executive-service/tokens e @betinhos-executive-service/ui $GITHUB_REF_NAME publicados no GitHub Packages. Mudanças no changelog (§20 do DESIGN_SYSTEM.md)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
